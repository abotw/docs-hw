site_name: HW Docs
site_url: http://abotw.github.io/docs-hw
repo_url: https://github.com/abotw/docs-hw
theme:

theme:
  name: material
  icon:
    logo: material/devices
  palette:
    primary: white
  features:
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

plugins:
  - search
